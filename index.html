<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Jade &amp; Iron"><meta name="theme-color" content="#f1ede2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#141712" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Jade &amp; Iron</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap">
<style>
/* Layout concept: one phone column. A single vertical line, the pole, is the spine of the
   plan and of the session player: time climbs it. Everything else stays quiet paper. */
:root {
  /* paper (light) */
  --stage: #dfdacb;
  --bg: #f1ede2;
  --surface: #faf7ef;
  --inset: #e7e2d3;
  --line: #d6d0be;
  --ink: #20251c;
  --ink-2: #555b4c;
  --ink-3: #868a79;
  --on-ink: #f4f0e4;
  /* the three pillars */
  --jade: #47705a;
  --jade-soft: #dbe5d8;
  --iron: #4f5b66;
  --iron-soft: #dde1e2;
  --brass: #8f6c1f;
  --brass-fill: #b08a3e;
  --brass-soft: #efe4c6;
  --blush: #a8625a;
  --blush-soft: #f1ddd6;
  /* figure */
  --fig: #20251c;
  --fig-far: #a7ab9a;
  --fig-focus: #b08a3e;
  --fig-focus-far: #d3bd8f;
  --fig-ground: #faf7ef;
  --fig-prop: #c4bda9;
  /* studio: the session player keeps one dark look in both themes */
  --st-bg: #11140f;
  --st-surface: #1b1f18;
  --st-line: #30362b;
  --st-ink: #f0ebdc;
  --st-ink-2: #b4b2a2;
  --st-ink-3: #7d8072;
  --st-brass: #d6b565;
  --st-jade: #8fb89c;
  --st-fig-far: #555c4d;
  /* type */
  --display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --radius: 20px;
  --gutter-l: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #0b0d0a; --bg: #141712; --surface: #1c2019; --inset: #232820; --line: #333a2e;
    --ink: #efeadb; --ink-2: #b9b6a6; --ink-3: #85887a; --on-ink: #171a14;
    --jade: #94bca0; --jade-soft: #24332a; --iron: #a3b0bb; --iron-soft: #262d33;
    --brass: #d6b565; --brass-fill: #c9a650; --brass-soft: #352c15; --blush: #e0a59b; --blush-soft: #3a2420;
    --fig: #efeadb; --fig-far: #5d6455; --fig-focus: #d6b565; --fig-focus-far: #8a7640; --fig-ground: #1c2019; --fig-prop: #4a5142;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #0b0d0a; --bg: #141712; --surface: #1c2019; --inset: #232820; --line: #333a2e;
  --ink: #efeadb; --ink-2: #b9b6a6; --ink-3: #85887a; --on-ink: #171a14;
  --jade: #94bca0; --jade-soft: #24332a; --iron: #a3b0bb; --iron-soft: #262d33;
  --brass: #d6b565; --brass-fill: #c9a650; --brass-soft: #352c15; --blush: #e0a59b; --blush-soft: #3a2420;
  --fig: #efeadb; --fig-far: #5d6455; --fig-focus: #d6b565; --fig-focus-far: #8a7640; --fig-ground: #1c2019; --fig-prop: #4a5142;
  color-scheme: dark;
}

/* Alternate looks, switchable in Settings so the palette can be judged in the hand. */
:root[data-look="bloom"] {
  --stage: #dcdccb; --bg: #ebebdf; --surface: #f6f6ec; --inset: #e0e1d1; --line: #cfd1bd;
  --ink: #3e4a35; --ink-2: #636d57; --ink-3: #8b927d;
  --jade: #6f7f5c; --jade-soft: #dfe5d2; --iron: #6d6a5c; --iron-soft: #e2e0d2;
  --brass: #9a5a4e; --brass-fill: #c08a7e; --brass-soft: #f0dcd5; --blush: #9a5a4e; --blush-soft: #f0dcd5;
  --fig: #3e4a35; --fig-far: #b3b9a3; --fig-focus: #c08a7e; --fig-focus-far: #e0c2ba; --fig-ground: #f6f6ec; --fig-prop: #c6c9b4;
}
:root[data-look="chrome"] {
  --stage: #d3d5d8; --bg: #eceded; --surface: #f8f8f7; --inset: #e0e2e3; --line: #cfd2d4;
  --ink: #1b1d20; --ink-2: #52575d; --ink-3: #858a90;
  --jade: #3f6b73; --jade-soft: #d6e3e5; --iron: #4b5560; --iron-soft: #dde1e4;
  --brass: #8a3f6a; --brass-fill: #b0578a; --brass-soft: #f0dbe6; --blush: #8a3f6a; --blush-soft: #f0dbe6;
  --fig: #1b1d20; --fig-far: #a8adb2; --fig-focus: #b0578a; --fig-focus-far: #d9a9c4; --fig-ground: #f8f8f7; --fig-prop: #c3c7ca;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-look="bloom"] {
    --stage: #0d0f0b; --bg: #171a13; --surface: #1f231a; --inset: #272c21; --line: #383e30;
    --ink: #ecead9; --ink-2: #b8b9a5; --ink-3: #868a78;
    --jade: #a9b996; --jade-soft: #2a3323; --iron: #b3b09f; --iron-soft: #2c2b24;
    --brass: #e0a99d; --brass-fill: #d39a8e; --brass-soft: #3a2521; --blush: #e0a99d; --blush-soft: #3a2521;
    --fig: #ecead9; --fig-far: #5f6653; --fig-focus: #e0a99d; --fig-focus-far: #8c6860; --fig-ground: #1f231a; --fig-prop: #4b5241;
  }
  :root:not([data-theme="light"])[data-look="chrome"] {
    --stage: #08090a; --bg: #121315; --surface: #1a1c1f; --inset: #222529; --line: #33373c;
    --ink: #eceef0; --ink-2: #b3b8be; --ink-3: #7f858c;
    --jade: #8fc1c9; --jade-soft: #1f3033; --iron: #a6b0bb; --iron-soft: #262b31;
    --brass: #e59ac3; --brass-fill: #d67fb0; --brass-soft: #3a1f2e; --blush: #e59ac3; --blush-soft: #3a1f2e;
    --fig: #eceef0; --fig-far: #575c63; --fig-focus: #e59ac3; --fig-focus-far: #8f5d78; --fig-ground: #1a1c1f; --fig-prop: #474c53;
  }
}
:root[data-theme="dark"][data-look="bloom"] {
  --stage: #0d0f0b; --bg: #171a13; --surface: #1f231a; --inset: #272c21; --line: #383e30;
  --ink: #ecead9; --ink-2: #b8b9a5; --ink-3: #868a78;
  --jade: #a9b996; --jade-soft: #2a3323; --iron: #b3b09f; --iron-soft: #2c2b24;
  --brass: #e0a99d; --brass-fill: #d39a8e; --brass-soft: #3a2521; --blush: #e0a99d; --blush-soft: #3a2521;
  --fig: #ecead9; --fig-far: #5f6653; --fig-focus: #e0a99d; --fig-focus-far: #8c6860; --fig-ground: #1f231a; --fig-prop: #4b5241;
}
:root[data-theme="dark"][data-look="chrome"] {
  --stage: #08090a; --bg: #121315; --surface: #1a1c1f; --inset: #222529; --line: #33373c;
  --ink: #eceef0; --ink-2: #b3b8be; --ink-3: #7f858c;
  --jade: #8fc1c9; --jade-soft: #1f3033; --iron: #a6b0bb; --iron-soft: #262b31;
  --brass: #e59ac3; --brass-fill: #d67fb0; --brass-soft: #3a1f2e; --blush: #e59ac3; --blush-soft: #3a1f2e;
  --fig: #eceef0; --fig-far: #575c63; --fig-focus: #e59ac3; --fig-focus-far: #8f5d78; --fig-ground: #1a1c1f; --fig-prop: #474c53;
}

html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--stage); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
*, *::before, *::after { box-sizing: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brass-fill); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.stage { height: 100%; display: grid; place-items: center; }
.app { position: relative; width: 100%; height: 100%; background: var(--bg); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
@media (min-width: 520px) and (min-height: 700px) {
  .app { width: 412px; height: min(880px, calc(100% - 40px)); border-radius: 44px; border: 1px solid var(--line); box-shadow: 0 30px 80px -40px rgba(20, 24, 16, .55); }
}

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.wordmark { font-family: var(--display); font-size: 19px; font-weight: 500; letter-spacing: -.01em; font-variation-settings: "opsz" 40, "SOFT" 50; }
.wordmark i { font-style: italic; font-weight: 400; color: var(--jade); padding: 0 .08em; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.pill-note { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); background: var(--brass-soft); border-radius: 999px; padding: 5px 10px; font-weight: 600; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- scrolling view ---------- */
.view { overflow-y: auto; overscroll-behavior: contain; padding-block: 6px 28px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); display: flex; flex-direction: column; gap: 22px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.view > *, .sheet-body > *, .p-done > * { flex-shrink: 0; }
.eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.h-display { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.04; letter-spacing: -.02em; font-variation-settings: "opsz" 120, "SOFT" 40; text-wrap: balance; }
.h-display em { font-style: italic; color: var(--jade); }
.h-section { font-family: var(--display); font-weight: 500; font-size: 21px; letter-spacing: -.01em; font-variation-settings: "opsz" 48, "SOFT" 40; }
.sub { color: var(--ink-2); font-size: 15px; }
.muted { color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-s { display: flex; flex-direction: column; gap: 4px; }
.grow { flex: 1; min-width: 0; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card.flush { padding: 0; overflow: hidden; }
.tap { text-align: left; width: 100%; display: block; }

.hero-session { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; }
.hero-session .fig-wrap { background: var(--inset); --fig-ground: var(--inset); padding: 6px 10px 0; }
.hero-session .fig { display: block; width: 100%; height: auto; max-height: 220px; }
.hero-session .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.hero-session .title { font-family: var(--display); font-size: 27px; line-height: 1.08; letter-spacing: -.015em; font-weight: 450; font-variation-settings: "opsz" 96, "SOFT" 40; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: 14px; }
.meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.blocks { display: flex; gap: 3px; height: 6px; border-radius: 3px; overflow: hidden; }
.blocks span { display: block; height: 100%; border-radius: 3px; background: var(--line); }
.blocks .b-warm { background: var(--ink-3); } .blocks .b-activate { background: var(--jade); } .blocks .b-main { background: var(--ink); }
.blocks .b-own { background: var(--brass-fill); } .blocks .b-down { background: var(--ink-3); opacity: .55; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }

.btn { height: 54px; border-radius: 999px; padding: 0 24px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-primary svg { width: 16px; height: 16px; fill: currentColor; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); }
.btn-quiet { height: 40px; padding: 0 14px; font-size: 14px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; background: transparent; font-weight: 500; }
.btn-block { width: 100%; }
.btn-s { height: 44px; font-size: 15px; padding: 0 18px; }

.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); padding-inline: var(--gutter-l) var(--gutter-r); scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 3px 7px; }
.tag.flex { color: var(--jade); background: var(--jade-soft); }
.tag.strength { color: var(--iron); background: var(--iron-soft); }
.tag.control { color: var(--brass); background: var(--brass-soft); }
.tag.plain { color: var(--ink-2); background: var(--inset); }

/* ---------- week strip ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 9px 0 8px; border-radius: 14px; border: 1px solid transparent; }
.day .dow { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.day .num { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.day.today { border-color: var(--ink); background: var(--surface); }
.day .marks { display: flex; gap: 3px; height: 7px; align-items: center; }
.mk { width: 7px; height: 7px; border-radius: 50%; }
.mk.class { background: transparent; border: 1.5px solid var(--iron); }
.mk.session { background: var(--line); }
.mk.done { background: var(--jade); }
.key { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.key span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.item:last-child { border-bottom: 0; }
.thumb { width: 64px; height: 54px; flex: none; border-radius: 12px; background: var(--inset); --fig-ground: var(--inset); display: grid; place-items: center; overflow: hidden; }
.thumb .fig { width: 100%; height: 100%; }
.item .name { font-weight: 600; font-size: 15.5px; line-height: 1.25; }
.item .desc { color: var(--ink-3); font-size: 13.5px; }
.item .dose { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chev { width: 16px; height: 16px; stroke: var(--ink-3); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.routines { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.routine { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 104px; }
.routine .rt { font-weight: 600; font-size: 15px; line-height: 1.2; }
.routine .rm { font-size: 13px; color: var(--ink-3); margin-top: auto; font-variant-numeric: tabular-nums; }

.quote { font-family: var(--display); font-style: italic; font-size: 19px; line-height: 1.3; color: var(--ink-2); font-variation-settings: "opsz" 40, "SOFT" 60; padding-left: 14px; border-left: 2px solid var(--brass-fill); text-wrap: balance; }

/* ---------- plan: the pole timeline ---------- */
.phasebar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.phase { border-radius: 14px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); }
.phase.now { border-color: var(--ink); }
.phase .pn { font-family: var(--display); font-size: 17px; font-weight: 500; }
.phase .pw { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.phase .pbar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
.phase .pbar i { display: block; height: 100%; background: var(--jade); }
.pole-list { position: relative; padding-left: 30px; display: flex; flex-direction: column; gap: 10px; }
.pole-list::before { content: ""; position: absolute; left: 9px; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--fig-prop), var(--line)); }
.wk { position: relative; }
.wk::before { content: ""; position: absolute; left: -26px; top: 18px; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 2px solid var(--fig-prop); }
.wk.done::before { background: var(--jade); border-color: var(--jade); }
.wk.now::before { background: var(--brass-fill); border-color: var(--brass-fill); box-shadow: 0 0 0 4px var(--brass-soft); }
.wk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 0 6px; width: 100%; text-align: left; }
.wk-title { font-weight: 600; font-size: 16px; }
.wk-note { font-size: 13px; color: var(--ink-3); }
.wk-body { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.sess { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; text-align: left; width: 100%; }
.sess .sday { width: 38px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.sess .st { font-weight: 600; font-size: 15px; }
.sess .sm { font-size: 13px; color: var(--ink-3); }
.sess.done { opacity: .62; }
.sess.classday { background: transparent; border-style: dashed; }
.check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; }
.check.on { background: var(--jade); border-color: var(--jade); }
.check.on::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--on-ink); border-bottom: 2px solid var(--on-ink); transform: rotate(-45deg) translate(1px, -1px); }

.how { padding: 0; }
.how summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; font-weight: 600; font-size: 15px; cursor: pointer; }
.how summary::-webkit-details-marker { display: none; }
.how[open] summary .chev { transform: rotate(90deg); }
.how-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 9px; }
.how-body p { font-size: 14.5px; line-height: 1.42; color: var(--ink-2); }
.how-body b { color: var(--ink); font-weight: 600; }

/* ---------- library ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--inset); border-radius: 999px; padding: 3px; }
.seg button { height: 36px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ex-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.ex-card .fig-wrap { background: var(--inset); --fig-ground: var(--inset); aspect-ratio: 6 / 5; display: grid; place-items: center; padding: 4px 6px 0; }

<script>
/*
 * Figure: a small 2D articulated body rig for exercise illustrations.
 * One pose is a set of absolute bone directions in degrees
 * (0 = toward screen right, 90 = up, 180 = left, 270 = down).
 * The same pose data can drive SVG in a browser, a contact sheet in Node,
 * or a SwiftUI Canvas later: the rig is only arithmetic.
 *
 * pose = {
 *   spine: [lumbar, thoracic, neck],          // pelvis -> waist -> chest -> head
 *   armN:  [upper, fore, hand?],              // near arm (drawn in front)
 *   armF:  [upper, fore, hand?],              // far arm (drawn behind, lighter)
 *   legN:  [thigh, shin, foot],               // near leg
 *   legF:  [thigh, shin, foot],               // far leg
 *   hipW:  0, shW: 0,                         // half widths for front views
 *   len:   { thoracic: 0.6, ... },            // per-bone length multipliers (foreshortening)
 *   air:   0,                                 // lift above the floor (hangs, jumps)
 *   pin:   'pelvis',                          // joint that stays put while animating
 *   focus: ['legN.thigh', 'spine'],           // bones drawn in the accent colour
 *   props: [{ type: 'block', under: 'handN' }, ...],
 *   arcs:  [{ at: 'hipN', a0: 0, a1: 180, r: 13, label: '180' }]
 * }
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Figure = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var LEN = { lumbar: 12.5, thoracic: 16, neck: 4.6, head: 5.2, upperArm: 15.5, foreArm: 13.5, hand: 4.6, thigh: 24, shin: 23, foot: 8.2 };
  // Joint radii: every bone is a tapered capsule between two of these.
  var RAD = { pelvis: 5.5, waist: 4.3, chest: 5.6, neckLo: 2.4, neckHi: 2.1, head: 5.7,
    shoulder: 3.3, elbow: 2.6, wrist: 1.9, hand: 1.5, hip: 5.0, knee: 3.5, ankle: 2.3, toe: 1.7 };

  function rad(d) { return d * Math.PI / 180; }
  function dir(d) { return [Math.cos(rad(d)), Math.sin(rad(d))]; }
  function add(p, v, k) { return [p[0] + v[0] * k, p[1] + v[1] * k]; }
  function r2(n) { return Math.round(n * 100) / 100; }

  // Length multipliers: by bone type ("shin") or for one limb only ("legN.shin"), which wins.
  function eff(L, key) { if (!L) return 1; if (L[key] != null) return L[key]; var i = key.indexOf('.'); if (i > 0 && L[key.slice(i + 1)] != null) return L[key.slice(i + 1)]; return 1; }
  function ln(pose, k, side) { return LEN[k] * eff(pose.len, side ? side + '.' + k : k); }

  function limb(base, a, l1, l2, l3) {
    var j1 = add(base, dir(a[0]), l1);
    var j2 = add(j1, dir(a[1]), l2);
    var j3 = add(j2, dir(a[2] != null ? a[2] : a[1]), l3);
    return [base, j1, j2, j3];
  }

  // Raw joint positions with the pelvis at the origin, y up.
  function solve(pose) {
    var sp = pose.spine || [90, 90, 90];
    var P = [0, 0];
    var Wst = add(P, dir(sp[0]), ln(pose, 'lumbar'));
    var C = add(Wst, dir(sp[1]), ln(pose, 'thoracic'));
    var N = add(C, dir(sp[2]), ln(pose, 'neck'));
    var H = add(N, dir(sp[2]), ln(pose, 'head'));
    var hipW = pose.hipW || 0, shW = pose.shW || 0;
    var ph = dir(sp[0] - 90), ps = dir(sp[1] - 90);
    var hipN = add(P, ph, hipW), hipF = add(P, ph, -hipW);
    var shN = add(C, ps, shW), shF = add(C, ps, -shW);
    return {
      pelvis: P, waist: Wst, chest: C, neck: N, head: H,
      armN: limb(shN, pose.armN || [270, 270], ln(pose, 'upperArm', 'armN'), ln(pose, 'foreArm', 'armN'), ln(pose, 'hand', 'armN')),
      armF: limb(shF, pose.armF || [270, 270], ln(pose, 'upperArm', 'armF'), ln(pose, 'foreArm', 'armF'), ln(pose, 'hand', 'armF')),
      legN: limb(hipN, pose.legN || [270, 270, 0], ln(pose, 'thigh', 'legN'), ln(pose, 'shin', 'legN'), ln(pose, 'foot', 'legN')),
      legF: limb(hipF, pose.legF || [270, 270, 0], ln(pose, 'thigh', 'legF'), ln(pose, 'shin', 'legF'), ln(pose, 'foot', 'legF'))
    };
  }

  function named(j, name) {
    switch (name) {
      case 'pelvis': return j.pelvis; case 'waist': return j.waist; case 'chest': return j.chest;

,"half-split-pnf","pike-compression-lift"],"watch":"Rounding the upper back to bring the head to the knees. The fold comes from the hips; the chest leads and the head arrives last."},{"id":"full-bridge","name":"Straight-arm bridge","group":"flex","level":2,"what":"Lying face up, pressed up on hands and feet into an even arch, arms straight and the shoulders as far over the wrists as they go.","needs":{"flex":[{"focus":"backbend","note":"Upper back extension, so the arch is shared along the spine and not parked in the low back."},{"focus":"shoulders","note":"Full overhead range with straight arms and the chest open."}],"strength":[{"focus":"press","note":"Straight-arm pushing strength to lift and hold the body overhead."},{"focus":"legs","note":"Glutes that drive the hips up with the knees in line over the feet."}]},"before":[],"drills":["bridge-hold","block-thoracic-extension","camel-reach","elevated-puppy-lift","glute-bridge"],"watch":"Hips high while the shoulders stay behind the wrists. Straighten the legs a little to drive the chest out over the hands."},{"id":"full-front-split","name":"Front split","group":"flex","level":3,"what":"Both legs straight and in one line along the floor, front kneecap up, back kneecap down, hips square and the pelvis resting on the floor.","needs":{"flex":[{"focus":"front-split","note":"Hamstring length in the front leg and hip flexor length in the back leg, with the hips square."}],"strength":[{"focus":"active-legs","note":"Strength at the end of the split to press the front heel down and lift back out without the hands."},{"focus":"legs","note":"Hamstrings strong at long length, built with slow lowering work."}]},"before":["flat-pike-fold"],"drills":["lunge-to-half-split","split-slides","front-split-hold","elevated-split-squat","rdl"],"watch":"Letting the back hip open to the side to reach the floor. Square comes first; a higher square split beats a low open one."},{"id":"flat-pancake","name":"Flat pancake","group":"flex","level":3,"what":"Seated in a wide straddle, folded forward from the hips until the chest rests on the floor, legs straight and kneecaps up.","needs":{"flex":[{"focus":"middle-split","note":"Adductor and hamstring length with the legs wide, and hips that tip forward over them."}],"strength":[{"focus":"core","note":"Hip flexors and abs that pull the torso down into the fold."},{"focus":"middle-split","note":"Adductors and hamstrings strong at length under a loaded good morning."}]},"before":["flat-pike-fold"],"drills":["wide-good-morning","bench-good-morning","plate-good-morning","weighted-pancake","straddle-leg-lift"],"watch":"Reaching the hands forward with a rounded back. Walk the chest, not the hands, toward the floor, and stop where the low back starts to round."},{"id":"full-middle-split","name":"Middle split","group":"flex","level":3,"what":"Legs straight out to each side in one line, kneecaps up, the pelvis on the floor and the torso upright.","needs":{"flex":[{"focus":"middle-split","note":"Adductor length out to each side, with hips that tip forward so the kneecaps stay up."}],"strength":[{"focus":"legs","note":"Adductors strong at long length, enough to pull you back out of the split without the hands."}]},"before":["resting-squat","flat-pancake"],"drills":["cossack-squat","middle-split-slides","horse-stance","copenhagen-plank","frog-pnf"],"watch":"Rolling the kneecaps down to slide lower. Keep them facing up and tip the pelvis forward instead; the depth that holds that is your split."},{"id":"front-extension","name":"Front leg extension","group":"dance","level":2,"what":"Standing tall on one straight leg, the other lifted straight to the front and held there under its own power, hips level.","needs":{"flex":[{"focus":"front-split","note":"Hamstring length in the lifted leg, so it is not lifting against its own stretch."}],"strength":[{"focus":"active-legs","note":"Hip flexor and quad strength to hold the leg at hip height or above for three counts without leaning back."},{"focus":"core","note":"A trunk that stays upright and still as the leg rises."}]},"before":[],"drills":["standing-leg-lift","front-unfold","banded-leg-lift-hold","supine-leg-raise","seated-leg-lift"],"watch":"Leaning back to make the leg look higher. Keep the ribs over the hips; the height you hold upright is the real height."},{"id":"side-extension","name":"Side leg extension","group":"dance","level":2,"what":"Standing tall on one leg, the other lifted straight out to the side and held, kneecap facing the ceiling and the pelvis level.","needs":{"flex":[{"focus":"middle-split","note":"Adductor and hamstring length on the lifting side."}],"strength":[{"focus":"active-legs","note":"Hip strength to hold the leg out to the side for three counts with the pelvis level."},{"focus":"legs","note":"A standing hip that stays level under you."}]},"before":[],"drills":["side-leg-lift","side-unfold","straddle-leg-lift","hip-airplane"],"watch":"Hiking the hip to raise the leg. Keep both hip points level and turn the leg out from the hip so the knee faces up."},{"id":"arabesque-line","name":"Arabesque","group":"dance","level":2,"what":"Standing on one straight leg with the other lifted straight behind, the chest lifted and the hips as square as the height allows.","needs":{"flex":[{"focus":"backbend","note":"Hip flexor length in the lifted leg and upper back extension to keep the chest up."}],"strength":[{"focus":"active-legs","note":"Glute and hamstring strength to lift the back leg and hold it for three counts."},{"focus":"backbend","note":"Back extensors that hold the chest up while the leg rises."}]},"before":[],"drills":["arabesque-lift","cobra-lift","couch-stretch","long-lunge-hover","hip-airplane"],"watch":"Dropping the chest to lift the leg higher. Hold the chest up and accept a lower leg; the line rises as the hip flexors open."},{"id":"standing-split","name":"Standing split","group":"dance","level":3,"what":"Folded over a straight standing leg with the hands on the floor, the other leg lifted straight up behind toward one vertical line.","needs":{"flex":[{"focus":"front-split","note":"Close to a full front split: hamstring length in the standing leg and hip flexor length in the lifted one."}],"strength":[{"focus":"active-legs","note":"Glute and hamstring strength to lift the back leg high while you are folded."},{"focus":"legs","note":"A standing leg that holds balance at full hamstring length."}]},"before":["full-front-split","arabesque-line"],"drills":["single-leg-rdl","arabesque-lift","front-split-hold","couch-stretch"],"watch":"Opening the hip to the side to get the foot higher. Keep both hip points facing the floor; a lower square leg is the cleaner split."},{"id":"minute-hang","name":"One minute hang","group":"cali","level":1,"what":"Hanging from a bar on straight arms for a full minute, shoulders drawn down away from the ears and the legs still.","needs":{"flex":[{"focus":"shoulders","note":"Overhead range to hang with straight arms and the ribs down."}],"strength":[{"focus":"pull","note":"Grip and shoulders that hold the hang with the shoulders set for sixty seconds."}]},"before":[],"drills":["active-hang","scapular-pull","flexed-arm-hang"],"watch":"Shoulders creeping to the ears as the grip tires. Set them down at the start; the hang ends when they rise."},{"id":"strict-pullup","name":"Strict pull-up","group":"cali","level":2,"what":"From a still hang on straight arms, pulling until the chin clears the bar and lowering all the way back to straight arms, with no kip or swing.","needs":{"flex":[],"strength":[{"focus":"pull","note":"Lats and arms that pull the chin over the bar from straight arms, then lower under control."},{"focus":"core","note":"A still trunk with the legs together, so no swing helps."}]},"before":["minute-hang"],"drills":["scapular-pull","negative-pullup","band-pulldown","flexed-arm-hang","pullup"],"watch":"Shortening the bottom of each rep. Every rep starts and ends at straight arms; half reps build half a pull."},{"id":"l-sit","name":"L-sit","group":"cali","level":2,"what":"Supported on straight arms on the floor or parallettes, legs straight and together and held level in front, hips off the floor.","needs":{"flex":[{"focus":"front-split","note":"Enough hamstring length that straight legs do not pull the pelvis under."}],"strength":[{"focus":"core","note":"Hip flexor and ab compression that holds straight legs up by themselves."},{"focus":"press","note":"Shoulders pushed down away from the ears on straight arms."}]},"before":[],"drills":["pike-compression-lift","seated-leg-lift","hollow-hold","hanging-knee-raise"],"watch":"Knees bending or shoulders shrugging as the hold gets hard. Tuck the legs to shorten the lever before you let the shoulders give."},{"id":"hanging-leg-raise","name":"Hanging leg raise","group":"cali","level":2,"what":"From a still hang, both straight legs lifted together to hip height or above, then lowered slowly back to the hang.","needs":{"flex":[{"focus":"front-split","note":"Hamstring length to lift straight legs past level without the knees bending."}],"strength":[{"focus":"core","note":"Hip flexors and abs that lift straight legs from a dead stop."},{"focus":"pull","note":"A grip and shoulder set that keep the hang still."}]},"before":["minute-hang"],"drills":["hanging-knee-raise","reverse-crunch","pike-compression-lift","active-hang","hollow-hold"],"watch":"Swinging the legs up and dropping them. Start from a still hang, lift on a count of two, and lower on three."},{"id":"pistol-squat","name":"Pistol squat","group":"cali","level":3,"what":"Squatting all the way down on one leg with the other held straight in front off the floor, then standing back up without help.","needs":{"flex":[{"focus":"legs","note":"Ankle range for the knee to travel far forward with the heel down."},{"focus":"front-split","note":"Hamstring length to hold the free leg straight in front at the bottom."}],"strength":[{"focus":"legs","note":"Single-leg strength to stand up from the very bottom."},{"focus":"active-legs","note":"Hip flexor strength to keep the free leg off the floor at the bottom."}]},"before":["resting-squat"],"drills":["elevated-split-squat","cossack-squat","split-squat","seated-leg-lift","squat-pry"],"watch":"Heel lifting or the knee caving in at the bottom. Go only as deep as the heel stays down and the knee tracks over the toes, and build depth from there."},{"id":"wall-handstand","name":"Wall handstand line","group":"cali","level":2,"what":"A handstand with the chest facing the wall, arms fully overhead, ribs in, and one straight line from wrists to heels.","needs":{"flex":[{"focus":"shoulders","note":"Full overhead range with the ribs down, so the line is not bought with a low back arch."}],"strength":[{"focus":"press","note":"Straight-arm overhead strength to stay pushed tall for thirty seconds."},{"focus":"core","note":"A hollow that keeps the ribs in and the line straight."}]},"before":[],"drills":["pike-pushup","elevated-puppy-lift","hollow-hold","wall-slide"],"watch":"Ribs flaring and the low back arching to stay up. Push tall through the shoulders and draw the ribs in until the line is straight."},{"id":"press-to-handstand","name":"Press to handstand","group":"cali","level":3,"what":"From standing with the hands on the floor, the hips lifted over the shoulders and the legs raised into a handstand on straight arms, with no jump.","needs":{"flex":[{"focus":"middle-split","note":"A deep pancake, so the legs can fold close to the chest in a wide straddle."}],"strength":[{"focus":"press","note":"Straight-arm shoulder strength to hold the body over the hands while the hips travel."},{"focus":"core","note":"Compression to lift the legs from the floor without a hop."}]},"before":["wall-handstand","l-sit","flat-pancake"],"drills":["planche-lean","pike-compression-lift","weighted-pancake","pike-pushup","straddle-leg-lift"],"watch":"Jumping the feet off the floor. Lean the shoulders over the hands until the feet float, and press only as high as you can without a hop."},{"id":"fireman-spin","name":"Fireman Spin","level":1,"what":"The first spin: both hands on the pole, one stacked above the other, knees drawn up together around the pole as the body swings round.","needs":{"flex":[{"focus":"shoulders","note":"The top arm reaches up and out to about 130 to 150 degrees with the wrist turned to grip. Nearly everyone has this."}],"strength":[{"focus":"pull","note":"A bent-arm pull that keeps the body close to the pole through the whole turn."},{"focus":"core","note":"Knees lifted and squeezed together without the hips swinging out."}]},"before":[],"drills":["active-hang","scapular-pull","pole-row","band-pulldown"],"watch":"Hanging off straight arms with the shoulders shrugged. Set the shoulders down, bend the arms, and keep the hips close to the pole.","group":"pole"},{"id":"pole-sit","name":"Pole Sit","level":1,"what":"Seated mid-pole with no hands, the pole clamped between the upper thighs and the top leg crossed over, torso upright.","needs":{"flex":[],"strength":[{"focus":"legs","note":"Inner thighs that squeeze hard and keep squeezing while the hands come off."},{"focus":"core","note":"Sit tall over the grip without leaning back to find balance."}]},"before":[],"drills":["copenhagen-plank","horse-stance","side-plank"],"watch":"Leaning back before the thigh grip is set. Cross, squeeze, and sit tall first, then let the hands go.","group":"pole"},{"id":"basic-climb","name":"Basic Climb","level":1,"what":"The foundation climb: the hands reach up, the shins and insteps clamp the pole, and the legs stand the body up the pole.","needs":{"flex":[],"strength":[{"focus":"pull","note":"A bent-arm hold that keeps you on the pole while the legs reset."},{"focus":"core","note":"Knees drawn up to the hands on each step, without swinging."},{"focus":"legs","note":"A foot and knee clamp you can stand on."}]},"before":["pole-sit"],"drills":["pole-row","band-pulldown","hanging-knee-raise","copenhagen-plank"],"watch":"Climbing on the arms alone. Clamp with the feet and knees, then stand the legs up and let the hands follow.","group":"pole"},{"id":"ballerina","name":"Ballerina","level":1,"what":"Leaning into the pole on a high twisted grip, the inside leg wrapped around it and the outside leg reaching long behind toward a split.","needs":{"flex":[{"focus":"front-split","note":"A long back leg for the basic shape; a 160 to 180 degree front split for the split version."},{"focus":"shoulders","note":"Shoulder and upper back range to wrap the chest around the pole with the top arm overhead."}],"strength":[{"focus":"pull","note":"A top arm that holds in a twisted grip, shoulder turned in and steady under load."},{"focus":"active-legs","note":"Glutes and low back that lift the back leg and hold it there."}]},"before":["fireman-spin"],"drills":["ir-eccentric","band-er-ninety","arabesque-lift","thoracic-open-book","front-split-hold"],"watch":"Collapsing into the pole as the leg extends. Hips behind the pole, shoulders in front, trunk held, then lengthen the leg.","group":"pole"},{"id":"superman","name":"Superman","level":1,"what":"Flying face down and level with the floor, the pole clamped between crossed thighs and the body reaching long from head to feet.","needs":{"flex":[{"focus":"backbend","note":"A little hip extension so the legs stay level behind you."}],"strength":[{"focus":"legs","note":"A thigh clamp that holds the whole body level."},{"focus":"backbend","note":"Back extensors and glutes that keep the chest and legs up in one line."}]},"before":["pole-sit","basic-climb"],"drills":["copenhagen-plank","cobra-lift","arabesque-lift","glute-bridge"],"watch":"Hips dropping below the line. Squeeze the thighs, reach long through the feet, and lift the chest to level.","group":"pole"},{"id":"cupid","name":"Cupid","level":1,"what":"Hands-free high on the pole, the top knee hooked and the straight bottom leg pressing the pole, the body bowed away in a long arc.","needs":{"flex":[{"focus":"backbend","note":"Spinal extension and hip flexor length to open the arc."}],"strength":[{"focus":"legs","note":"A knee hook and a foot press strong enough to hold with no hands, bottom leg straight."},{"focus":"backbend","note":"Back extensors that lower you into the arc and bring you back out."}]},"before":["pole-sit","basic-climb"],"drills":["slider-hamstring-curl","camel-reach","cobra-lift","couch-stretch"],"watch":"Bending only at the low back. Lift the chest and spread the bend through the upper back as you lean away.","group":"pole"},{"id":"jamilla","name":"Jamilla","level":1,"what":"Side-on in a split grip, the inside thigh pressed to the pole, the body rolled over it so both legs open into a split.","needs":{"flex":[{"focus":"front-split","note":"A straight leg that rises to at least 90 degrees."},{"focus":"middle-split","note":"A seated straddle; adductors open past 90 degrees make the shape easier."}],"strength":[{"focus":"press","note":"A bottom arm that pushes: 5 to 10 kneeling push-ups with clean form."},{"focus":"pull","note":"A top arm that pulls: 5 to 10 inverted pole rows."},{"focus":"core","note":"A steady 30 second plank to hold the body against rotation."}]},"before":["fireman-spin"],"drills":["pushup","pole-row","plank-shoulder-tap","supine-leg-raise"],"watch":"Letting the bottom shoulder sink into the push. Press the bottom hand into the pole, pull with the top, and keep the shoulders level.","group":"pole"},{"id":"reiko-split","name":"Reiko Split","level":1,"what":"A hanging front split: one foot pressed flat on the pole, one hand holding above, the other leg reaching away from the pole.","needs":{"flex":[{"focus":"front-split","note":"Front split depth, mostly passive, with the pressing foot holding the front leg."}],"strength":[{"focus":"pull","note":"A two-hand pull that lifts the body as the foot presses, then a one-hand hold."},{"focus":"active-legs","note":"A back leg you can lift and hold away from the pole."}]},"before":["basic-climb"],"drills":["front-split-hold","split-slides","active-hang","arabesque-lift"],"watch":"Letting the split drop deeper once the hand releases. Keep the foot pressing and the hips square, and open only to the split you own on the floor.","group":"pole"},{"id":"basic-invert","name":"Basic Invert","level":2,"what":"From standing, the knees tuck and the hips tip up until they are above the head and the legs open into a V around the pole.","needs":{"flex":[{"focus":"middle-split","note":"A straddle wide enough for the legs to open around the pole with the hips folded."}],"strength":[{"focus":"pull","note":"Hold a tuck on bent arms with both feet off the floor, no jump."},{"focus":"core","note":"A hollow hold with the low back down, and a knee tuck that can curl the pelvis up."}]},"before":["basic-climb","fireman-spin"],"drills":["hollow-hold","hanging-knee-raise","pole-row","reverse-crunch"],"watch":"Kicking or jumping into it. Keep the arms bent, curl the pelvis, and let the hips rise over the head before the legs open.","group":"pole"},{"id":"crucifix","name":"Crucifix","level":2,"what":"Upside down on the leg grip alone, ankles crossed and thighs clamped, arms released wide.","needs":{"flex":[{"focus":"middle-split","note":"Easy hip rotation so the knees and ankles can lock the pole."}],"strength":[{"focus":"legs","note":"Inner thighs and the backs of the knees clamping hard enough to hold you upside down."},{"focus":"core","note":"A crunch back up to the pole with control."}]},"before":["basic-climb","basic-invert"],"drills":["copenhagen-plank","slider-hamstring-curl","reverse-crunch"],"watch":"Releasing the hands before the legs are locked. Cross the ankles, squeeze the knees, then lower back slowly.","group":"pole"},{"id":"gemini","name":"Gemini","level":2,"what":"The outside leg hang: inverted with the outside knee hooked on the pole, the inside leg pressed back along it, the body draped away.","needs":{"flex":[{"focus":"middle-split","note":"Outward hip rotation in the hooking leg."},{"focus":"backbend","note":"Hip flexor and front body length so the straight leg can press back."},{"focus":"shoulders","note":"Arms that open wide behind you with the chest open."}],"strength":[{"focus":"legs","note":"A hamstring that holds the knee hook, and glutes that press the straight leg back."}]},"before":["basic-invert"],"drills":["slider-hamstring-curl","ninety-ninety-lift-off","arabesque-lift","couch-stretch"],"watch":"Letting go before the hook is set. Pull the top knee tight, flex the foot, and press the straight leg back first, with a planned way out.","group":"pole"},{"id":"layback","name":"Layback","level":2,"what":"From a pole sit with the legs crossed, the torso lowers back until it hangs away from the pole, hands free.","needs":{"flex":[{"focus":"backbend","note":"Upper and lower back extension to open the chest as you hang."}],"strength":[{"focus":"legs","note":"A crossed-knee clamp that holds the full weight of the torso."},{"focus":"core","note":"Slow, controlled abdominals to lower down and to sit back up."}]},"before":["pole-sit"],"drills":["copenhagen-plank","reverse-crunch","camel-reach","block-thoracic-extension"],"watch":"Lowering before the knees are locked. Cross and squeeze the legs first, then lower one vertebra at a time.","group":"pole"},{"id":"scorpio","name":"Scorpio","level":2,"what":"The inside leg hang: inverted with the inside knee hooked on the pole and the body held out from it, the free leg reaching away.","needs":{"flex":[{"focus":"middle-split","note":"Outward hip rotation in the hooking leg."},{"focus":"front-split","note":"For the split version, a front split of 160 to 180 degrees."}],"strength":[{"focus":"legs","note":"A knee hook that holds the whole body."},{"focus":"backbend","note":"Back and glutes that hold the body level with the floor."}]},"before":["basic-invert","gemini"],"drills":["slider-hamstring-curl","cobra-lift","arabesque-lift","glute-bridge"],"watch":"Letting the body sag below the line. Squeeze the hook, lift through the back, and reach the free leg long.","group":"pole"},{"id":"brass-monkey","name":"Brass Monkey","level":2,"what":"Inverted with the outside knee hooked high and the same-side hand pressing the pole below, the body held compact or opened into a star.","needs":{"flex":[{"focus":"shoulders","note":"Arms raised to about 90 degrees and pressing in both arms."},{"focus":"middle-split","note":"Hips turned out about 45 degrees and opened a little to the side."}],"strength":[{"focus":"press","note":"An overhead push in both arms that keeps the shoulders steady."},{"focus":"legs","note":"Hamstring and glute strength to hold the knee hook at about 100 degrees."}]},"before":["basic-invert","gemini"],"drills":["half-kneeling-press","band-er-ninety","slider-hamstring-curl","pike-pushup"],"watch":"Shoulders sinking toward the ears as the weight comes on. Press the pole away through both arms and keep the knee hook tight.","group":"pole"},{"id":"aerial-invert","name":"Aerial Invert","level":2,"what":"An invert started with both feet already off the floor, the hips lifted over the head by the arms and trunk alone.","needs":{"flex":[{"focus":"middle-split","note":"A straddle or pike that lets the legs clear the pole as the hips rise."}],"strength":[{"focus":"pull","note":"Bent arms that hold while the body tips, with no floor to push from."},{"focus":"core","note":"Compression strong enough to lift the hips from a hang without a swing."}]},"before":["basic-invert","basic-climb"],"drills":["hanging-knee-raise","flexed-arm-hang","negative-pullup","pike-compression-lift"],"watch":"Swinging the legs to start it. Hold the bent arms, curl the pelvis, and lift the hips before the legs open.","group":"pole"},{"id":"butterfly","name":"Butterfly","level":2,"what":"Inverted with one foot hooked on the pole above and the hands in a split grip below, the body arched between them and the free leg extended.","needs":{"flex":[{"focus":"shoulders","note":"The bottom arm reaches full overhead, about 180 degrees, with the ribs down."}],"strength":[{"focus":"press","note":"An overhead push through a straight bottom arm."},{"focus":"pull","note":"A horizontal pull in the top arm."},{"focus":"core","note":"Side body strength to hold against rotation."},{"focus":"legs","note":"Hamstrings and glutes that hold the hooked foot."}]},"before":["basic-invert","gemini"],"drills":["down-dog-arm-lift","pole-row","side-plank","slider-hamstring-curl","elevated-puppy-lift"],"watch":"Bottom elbow bending and the shoulder sinking toward the ear. Push the bottom hand into the pole, arm straight, and pull with the top.","group":"pole"},{"id":"shoulder-mount","name":"Shoulder Mount","level":2,"what":"An invert led from the top of the shoulder against the pole, the hands pulling the pole in as the legs lift overhead.","needs":{"flex":[{"focus":"backbend","note":"An upper back that extends and rotates freely so the shoulder sits on the pole without pinching."}],"strength":[{"focus":"pull","note":"A strong pull, and a 5 to 8 second lower from the top of a pull-up."},{"focus":"core","note":"A tight knee tuck that lifts the hips without a kick."}]},"before":["basic-invert","basic-climb"],"drills":["negative-pullup","band-pulldown","scapular-pull","reverse-crunch","hanging-knee-raise"],"watch":"Kicking up and landing the weight in the neck. Pull the pole into the shoulder, tuck the knees tight, and lift on the pull.","group":"pole"},{"id":"extended-butterfly","name":"Extended Butterfly","level":2,"what":"A butterfly opened out: the top leg straightens so only the ankle holds the pole, the chest comes off it, and the legs open into a split.","needs":{"flex":[{"focus":"shoulders","note":"Full overhead reach in the bottom arm, about 180 degrees, ribs down."},{"focus":"front-split","note":"Enough split to straighten both legs without the hips turning off line."}],"strength":[{"focus":"press","note":"More push than the butterfly through a straight bottom arm."},{"focus":"pull","note":"More pull in the top arm to hold the chest away from the pole."},{"focus":"active-legs","note":"A straight top leg held by its own muscles at the ankle hold."}]},"before":["butterfly"],"drills":["down-dog-arm-lift","pole-row","half-kneeling-press","front-leg-lift-off","side-plank"],"watch":"Straightening the top leg before the arms are set. Lock the push and pull first, then extend the leg.","group":"pole"},{"id":"jade-split","name":"Jade Split","level":3,"what":"An inverted split held side-on at the pole, the bottom arm straight on the pole and the top hand binding the front leg as the legs open toward flat.","needs":{"flex":[{"focus":"front-split","note":"A front split of 160 to 180 degrees, hips square, on the side you fly."}],"strength":[{"focus":"press","note":"A straight bottom arm that holds the body off the pole; the no-hands version needs it straight."},{"focus":"legs","note":"A hamstring strong at length in the front leg, holding the split without the hand."}]},"before":["gemini","scorpio"],"drills":["front-split-hold","front-leg-lift-off","split-slides","single-leg-rdl","down-dog-arm-lift"],"watch":"Hauling the front leg in with the hand past what the hamstring can hold. Open to the split you own on the floor, hips square.","group":"pole"},{"id":"chopsticks","name":"Chopsticks","level":3,"what":"A front split held level high on the pole, the pole clamped at the top of the thighs and the torso folded over the front leg.","needs":{"flex":[{"focus":"front-split","note":"A 160 to 180 degree front split; for the no-hands version, both legs level with the floor."}],"strength":[{"focus":"legs","note":"A leg clamp that holds the split up without the hands."},{"focus":"core","note":"Trunk flexion strength to fold forward and come back up."}]},"before":["pole-sit","ballerina"],"drills":["front-split-hold","split-slides","copenhagen-plank","pike-compression-lift","single-leg-rdl"],"watch":"Letting gravity drop the legs into the split. Clamp the pole, keep the hips square, and fold from the hips over the front leg.","group":"pole"},{"id":"titanic","name":"Titanic","level":3,"what":"Face up on a thigh hold, the back arched away from the pole and the arms flung wide with no hands on it.","needs":{"flex":[{"focus":"backbend","note":"Back extension and hip flexor length to open the arch."}],"strength":[{"focus":"legs","note":"A thigh clamp that holds with no hands and still arms."},{"focus":"backbend","note":"Back extensors that lower into the arch and hold it."}]},"before":["pole-sit","superman","layback"],"drills":["copenhagen-plank","cobra-lift","camel-reach","arabesque-lift"],"watch":"Arching from the low back alone. Lock the thigh grip, then spread the arch through the upper back with the chest lifting.","group":"pole"},{"id":"allegra","name":"Allegra","level":3,"what":"From an inside leg hang, the free leg reaches behind into a split held by the hand, the chest turned open through the frame of arm and leg.","needs":{"flex":[{"focus":"backbend","note":"Spinal extension past 45 degrees and upper back rotation past 75 degrees."},{"focus":"front-split","note":"A comfortable open split for the passé version; 180 with straight legs for the full one."},{"focus":"shoulders","note":"For the closed version, more shoulder extension to reach the back leg."}],"strength":[{"focus":"active-legs","note":"Glutes and hamstrings that lift and hold the back leg behind."},{"focus":"legs","note":"A hooked knee held turned out, strong enough to hang the body from."},{"focus":"core","note":"Obliques that hold the twist."}]},"before":["scorpio","basic-invert"],"drills":["thoracic-open-book","arabesque-lift","front-split-hold","camel-reach","side-plank"],"watch":"Twisting from the low back. Turn the chest through the upper back, keep the hook turned out, and reach the back leg long.","group":"pole"},{"id":"ayesha","name":"Ayesha","level":3,"what":"Upside down on the hands alone, one arm pushing below and one pulling above, the legs open in a straddle off the pole.","needs":{"flex":[{"focus":"shoulders","note":"The bottom arm reaches 180 degrees overhead with the ribs down; the top arm about 110. A twisted grip also asks for about 60 degrees of inward shoulder rotation, and the bottom wrist takes weight bent back."},{"focus":"middle-split","note":"Hamstring and adductor length for a straddle that stays open while the hips stack."}],"strength":[{"focus":"press","note":"A single-arm overhead push, 3 sets of 10 a side in down dog."},{"focus":"shoulders","note":"Overhead outward rotation, 3 sets of 8 pulling a band apart."},{"focus":"pull","note":"A horizontal pull, 3 sets of 8 incline rows a side."},{"focus":"core","note":"Anti-rotation and hip flexors that keep the hips stacked: 2 sets of 20 plank taps."}]},"before":["jamilla","butterfly","extended-butterfly"],"drills":["down-dog-arm-lift","overhead-er","pole-row","plank-shoulder-tap","elevated-puppy-lift"],"watch":"Flaring the ribs to find the overhead line, then a bent bottom arm. Ribs down, push tall through the bottom hand, pull with the top.","group":"pole"},{"id":"janeiro","name":"Janeiro","level":3,"what":"A flag braced on the forearm and hand, the body held out from the pole with the legs split.","needs":{"flex":[{"focus":"backbend","note":"Spinal extension and side bend in both directions."}],"strength":[{"focus":"press","note":"Horizontal and overhead push through the bracing arm."},{"focus":"core","note":"Side body strength that holds the body level against a side bend."},{"focus":"active-legs","note":"Hip extension strength to hold the back leg up in the split."}]},"before":["shoulder-mount","brass-monkey","ayesha"],"drills":["side-plank","half-kneeling-press","arabesque-lift","cobra-lift"],"watch":"Hips dropping out of the line. Press the pole away, lift the bottom side of the waist, and drive the back leg up.","group":"pole"},{"id":"marion-amber","name":"Marion Amber","level":3,"what":"A split pressed off the hands and held out from the pole near level, the back arched and the legs opened toward flat.","needs":{"flex":[{"focus":"front-split","note":"A front split of 160 to 180 degrees."},{"focus":"shoulders","note":"Overhead shoulder range of the kind an Ayesha asks for."}],"strength":[{"focus":"press","note":"Pressing arms strong enough to hold the body away from the pole."},{"focus":"core","note":"A trunk that holds the arch without hanging in the low back."}]},"before":["ayesha","jade-split"],"drills":["half-kneeling-press","down-dog-arm-lift","front-split-hold","elevated-puppy-lift"],"watch":"Letting the split close as the arms tire. Press the pole away, hold the back leg up, and keep the arch spread through the upper back.","group":"pole"},{"id":"handspring","name":"Handspring","level":3,"what":"Pressed from the floor straight up into an inverted straddle on the hands alone, with no kick-through.","needs":{"flex":[{"focus":"shoulders","note":"Everything the Ayesha asks for, plus about 150 degrees of reach out to the side in a twisted-grip top arm."}],"strength":[{"focus":"pull","note":"A top arm that pulls the body in as it lifts."},{"focus":"core","note":"Abdominals and hip flexors that hold against arching at the sticking point."},{"focus":"press","note":"A bottom arm that stays straight through the lift."}]},"before":["ayesha"],"drills":["hollow-hold","hanging-knee-raise","overhead-er","negative-pullup","down-dog-arm-lift"],"watch":"Hips falling away from the pole at the sticking point. Drive the knees to the chest to shorten the lever, then open.","group":"pole"},{"id":"cocoon","name":"Cocoon","level":3,"what":"A closed ring held off the pole on two points, the back arched and the legs split so the feet fold in toward the head.","needs":{"flex":[{"focus":"backbend","note":"A deep backbend shared through the upper back, not taken in the low back."},{"focus":"front-split","note":"A front split of 160 to 180 degrees."},{"focus":"shoulders","note":"Overhead reach to close the ring."}],"strength":[{"focus":"press","note":"Shoulders that hold the body on two points of contact."},{"focus":"backbend","note":"Back extensors that hold the arch with muscle."}]},"before":["extended-butterfly","ayesha"],"drills":["bridge-hold","elevated-puppy-lift","couch-stretch","front-split-hold","camel-reach"],"watch":"Taking the whole ring in the low back. Lift the chest, spread the bend through the upper back, and reach the feet in from the hips.","group":"pole"},{"id":"russian-split","name":"Russian Split","level":3,"what":"A full front split laced along the pole while inverted, one foot gripping the pole and the torso held out from it.","needs":{"flex":[{"focus":"front-split","note":"A flat, 180 degree front split, hips square."}],"strength":[{"focus":"legs","note":"Foot and ankle strength to grip the pole with the top foot."},{"focus":"pull","note":"An arm pull that holds the torso out toward level."}]},"before":["jade-split","scorpio"],"drills":["front-split-hold","front-leg-lift-off","split-slides","calf-raise","single-leg-rdl"],"watch":"Sinking into the split by hanging on the foot. Hold the hips square, pull the torso up, and keep the split you own.","group":"pole"},{"id":"iron-x","name":"Iron X","level":3,"what":"The full flag: arms straight on the pole, body held level and out from it, legs straight in a wide X.","needs":{"flex":[{"focus":"shoulders","note":"Full overhead reach in the top arm in the grip you fly in."},{"focus":"middle-split","note":"A wide straddle you can hold actively; shorten it to an Iron K until the width is yours."}],"strength":[{"focus":"pull","note":"Straight-arm strength through the lats."},{"focus":"core","note":"Anti-extension, anti-rotation, and side body strength to hold the body level."},{"focus":"active-legs","note":"Outer hip and glute strength that holds the straddle open."}]},"before":["handspring","ayesha"],"drills":["side-plank","hollow-hold","hollow-arm-sweep","side-leg-lift","ir-eccentric"],"watch":"Arching or rotating the hips to find level. Tuck the tailbone, keep the pelvis neutral, and shorten the lever before you lengthen it.","group":"pole"},{"id":"bird-of-paradise","name":"Bird of Paradise","level":3,"what":"A standing split bound against the pole, the lifted leg held up overhead by the arms laced around it.","needs":{"flex":[{"focus":"front-split","note":"A full standing or floor front split."},{"focus":"shoulders","note":"Full overhead and side reach, with strength at the end of that range."},{"focus":"backbend","note":"Upper back rotation to lace the arms around the leg."}],"strength":[{"focus":"active-legs","note":"Active lift in the held leg, and the other leg held long with the hip extended and turned out."},{"focus":"shoulders","note":"Shoulders strong at full reach, with a firm elbow hook and grip."}]},"before":["ballerina","jade-split"],"drills":["standing-leg-lift","banded-leg-lift-hold","front-split-hold","elevated-puppy-lift","thoracic-open-book"],"watch":"Hauling the leg up with the arms past where the hips can hold it. Lift the leg first, then bind, and keep the standing hip stacked.","group":"pole"}],"benchmarks":[{"id":"front-split-gap","name":"Front split gap","unit":"cm","better":"lower","focus":"front-split","how":"After your usual warm-up, stand a tape measure upright beside your front hip, prop your phone side on at floor level, and film yourself sliding into your front split with hips square and hands on blocks. Hold 5 seconds at the deepest point you keep square, then read the height of the base of your pelvis off the tape in the video.","note":"Same side and same warm-up every test. Flat on the floor is 0."},{"id":"active-leg-lift","name":"Active front leg lift","unit":"deg","better":"higher","focus":"active-legs","how":"Prop your phone side on at hip height, stand with your back against a wall, and lift one straight leg in front with no hands to the highest point you can hold for 3 seconds. Read the angle between your two legs from the video.","note":"Then hold the same leg up with your hand and read that angle too. The difference is your active to passive gap."},{"id":"middle-split-gap","name":"Middle split gap","unit":"cm","better":"lower","focus":"middle-split","how":"After your usual warm-up, stand a tape measure upright beside your hip, prop your phone facing you at floor level, and film yourself sliding into your middle split with kneecaps up and hands on blocks. Hold 5 seconds at the deepest point where the kneecaps stay up, then read the height of the base of your pelvis off the tape in the video.","note":"Same foot position and same warm-up every test."},{"id":"bridge-hands-to-heels","name":"Bridge hands to heels","unit":"cm","better":"lower","focus":"backbend","how":"Lay a tape measure on the floor with your heels at its zero end and your phone filming side on. Push up into a straight-arm bridge, walk your hands toward your feet as far as you can hold for 3 seconds with the arms straight, and read the distance from heels to fingertips on the video.","note":"Keep the same foot width every test."},{"id":"overhead-reach","name":"Overhead reach","unit":"deg","better":"higher","focus":"shoulders","how":"Prop your phone side on and stand with your head, upper back, and low back flat against a wall. Raise both straight arms overhead as far as you can without the ribs leaving the wall, hold 3 seconds, and read the angle between arm and torso from the video.","note":"180 means your thumbs reach the wall with your ribs down."},{"id":"dead-hang","name":"Active hang","unit":"s","better":"higher","focus":"pull","how":"Hang from a bar with straight arms, shoulders drawn down away from your ears and ribs down, and start the clock. Stop it when your shoulders creep up or your grip opens, or at 60 seconds.","note":"Same bar and same grip every test."},{"id":"hollow-hold","name":"Hollow hold","unit":"s","better":"higher","focus":"core","how":"Lie on your back, press your low back into the floor, and lift straight arms overhead and straight legs a hand width off the floor. Start the clock and stop it when your low back lifts, or at 60 seconds.","note":"Arms by your ears the whole time."},{"id":"pike-pushups","name":"Pike push-ups","unit":"reps","better":"higher","focus":"press","how":"From an inverted V with hands shoulder width, lower over 3 seconds until the crown of your head lightly touches the floor, then press back to straight arms. Count clean reps; the set ends when your hips drop, the lowering speeds up, or the head stops short of the floor.","note":"Same hand and foot spacing every test."},{"id":"single-leg-bridge","name":"Single-leg bridge","unit":"reps","better":"higher","focus":"legs","how":"Lie on your back with one foot flat near your hip and the other leg straight up, then lift your hips to a straight line from knee to shoulder and lower until they touch the floor. Count clean reps; the set ends when your hips tilt or stop short of the line.","note":"Test both sides and log the lower count."},{"id":"pancake-reach","name":"Pancake reach","unit":"cm","better":"lower","focus":"middle-split","how":"After your usual warm-up, sit in your widest straddle with the kneecaps up, a tape measure stood upright in front of you, and your phone propped side on at floor level. Fold forward from the hips with a long back, hold 5 seconds at the deepest point where the kneecaps stay up, then read the height of your breastbone above the floor off the tape in the video.","note":"Mark your heels so the straddle is the same width every test. Chest on the floor is 0."},{"id":"active-side-lift","name":"Active side leg lift","unit":"deg","better":"higher","focus":"active-legs","how":"Prop your phone facing you at hip height and stand tall with one fingertip on a wall for balance. Lift one straight leg out to the side, kneecap up, to the highest point you can hold for 3 seconds with the pelvis level, and read the angle between your two legs from the video.","note":"Height won by tipping the torso or hiking the hip does not count. Test both sides and log the lower one."}],"routines":[{"id":"pre-class-primer","name":"Pre-class primer","pillar":"control","items":[{"ex":"cat-cow","block":"warm","dose":{"sets":1,"sec":40}},{"ex":"shoulder-circles","block":"warm","dose":{"sets":1,"sec":30}},{"ex":"wrist-prep","block":"warm","dose":{"sets":1,"sec":40}},{"ex":"worlds-greatest-stretch","block":"warm","dose":{"sets":1,"sec":30}},{"ex":"standing-hip-circle","block":"activate","dose":{"sets":1,"sec":30}},{"ex":"scapular-pushup","block":"activate","dose":{"sets":1,"reps":8,"tempo":"2 s hold at the top","rest":0}},{"ex":"supine-leg-raise","block":"activate","dose":{"sets":1,"reps":5,"tempo":"2 s hold at the top, 3 s down","rest":0}},{"ex":"active-hang","block":"activate","dose":{"sets":1,"sec":15}}],"pair":{"with":"pole","when":"before"},"why":"Warms the spine, wrists, and shoulders and rehearses the hang and the leg lift, with no hold long enough to cost you grip."},{"id":"post-class-downshift","name":"After-class downshift","pillar":"flex","items":[{"ex":"childs-pose-breath","block":"down","dose":{"sets":1,"sec":45}},{"ex":"low-lunge","block":"down","dose":{"sets":1,"sec":45}},{"ex":"half-split-pnf","block":"down","dose":{"sets":2,"sec":30,"rest":0}},{"ex":"figure-four","block":"down","dose":{"sets":1,"sec":45}},{"ex":"puppy-pose","block":"down","dose":{"sets":1,"sec":40}},{"ex":"supine-twist","block":"down","dose":{"sets":1,"sec":40}},{"ex":"legs-up-wall","block":"down","dose":{"sets":1,"sec":60}}],"pair":{"with":"pole","when":"after"},"why":"Longer holds for the hips, hamstrings, and shoulders while they are warm, then the breath comes down."},{"id":"ten-minute-splits","name":"Ten minute splits","pillar":"flex","items":[{"ex":"lunge-to-half-split","block":"main","dose":{"sets":2,"reps":6,"tempo":"3 s each way","rest":30}},{"ex":"couch-stretch","block":"main","dose":{"sets":1,"sec":40}},{"ex":"split-slides","block":"     return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><path class="a" d="' + d + ' L' + last[0].toFixed(1) + ' ' + h + ' L' + pts[0][0].toFixed(1) + ' ' + h + ' Z"/><path class="l" d="' + d + '"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.6"/></svg>';
  }

  function viewProgress() {
    var out = [], cw = currentWeek(), logs = S.logs;
    var planned = 0, done = 0;
    for (var w = 1; w <= cw; w++) weekPlan(w).forEach(function (d) { if (d.session && d.date <= TODAY) { planned++; if (isDone(d.session.key)) done++; } });
    var totalMin = logs.reduce(function (a, l) { return a + (l.minutes || 0); }, 0);
    var jl = logs.filter(function (l) { return l.joints; }).slice(-6), jAvg = jl.length ? (jl.reduce(function (a, l) { return a + l.joints; }, 0) / jl.length) : 0;
    out.push('<div class="stack-s"><div class="eyebrow">Progress</div><h1 class="h-display">' + (done ? done + ' of ' + planned + ' sessions. <em>Kept.</em>' : 'Nothing logged <em>yet.</em>') + '</h1>' + (S.sample ? '<p class="sub">Example data, so you can see how this fills in.</p>' : '') + '</div>');
    out.push('<div class="stat-row"><div class="stat"><div class="sv">' + totalMin + '</div><div class="sl">minutes trained</div></div><div class="stat"><div class="sv">' + (jAvg ? jAvg.toFixed(1) : '·') + '</div><div class="sl">joints, last six</div></div><div class="stat"><div class="sv">' + Object.keys(S.moves).filter(function (k) { return S.moves[k] === 'got'; }).length + '</div><div class="sl">skills owned</div></div></div>');

    var heat = '';
    for (var k = 1; k <= 12; k++) {
      var cells = weekPlan(k).filter(function (d) { return d.session; });
      heat += '<div class="col" title="Week ' + k + '">' + cells.map(function (d) { return '<i class="' + (isDone(d.session.key) ? 'on' : +d.date === +TODAY ? 'next' : '') + '"></i>'; }).join('') + '</div>';
    }
    out.push('<section class="card stack"><div class="row between"><h2 class="h-section">Twelve weeks</h2><span class="muted" style="font-size:13px">week ' + cw + '</span></div><div class="heat">' + heat + '</div><p class="note">One square per planned session. Missed ones stay empty. No streaks to protect.</p></section>');

    var weeks = [], maxMin = 1;
    for (var x = Math.max(1, cw - 5); x <= cw; x++) {
      var m = { f: 0, s: 0, c: 0, w: x }, from = addDays(startDate(), (x - 1) * 7), to = addDays(from, 7);
      logs.forEach(function (l) { var d = fromIso(l.date); if (d >= from && d < to) m[l.pillar === 'flex' ? 'f' : l.pillar === 'strength' ? 's' : 'c'] += l.minutes || 0; });
      weeks.push(m); maxMin = Math.max(maxMin, m.f + m.s + m.c);
    }
    out.push('<section class="card stack"><h2 class="h-section">Minutes by pillar</h2><div class="bars">' + weeks.map(function (m) {
      return '<div class="b"><i class="c" style="height:' + (100 * m.c / maxMin) + '%"></i><i class="s" style="height:' + (100 * m.s / maxMin) + '%"></i><i class="f" style="height:' + (100 * m.f / maxMin) + '%"></i></div>';
    }).join('') + '</div><div class="bars-x">' + weeks.map(function (m) { return '<span>W' + m.w + '</span>'; }).join('') + '</div><div class="legend"><span><i style="background:var(--jade)"></i>Flexibility</span><span><i style="background:var(--iron)"></i>Strength</span><span><i style="background:var(--brass-fill)"></i>Control</span></div></section>');

    out.push('<section class="stack"><div class="row between"><h2 class="h-section">Benchmarks</h2><span class="muted" style="font-size:13px">retest every 4 weeks</span></div><div class="card" style="padding:4px 16px">' + C.benchmarks.map(function (b) {
      var series = (S.bench[b.id] || []), vals = series.map(function (r) { return r.value; }), last = vals[vals.length - 1], first = vals[0];
      var delta = vals.length > 1 ? last - first : 0, good = b.better === 'lower' ? delta < 0 : delta > 0;
      return '<button class="bench" data-act="bench" data-id="' + b.id + '"><span class="grow"><span class="name" style="font-weight:600">' + esc(b.name) + '</span><br><span class="bd ' + (delta ? (good ? 'up' : 'flat') : 'flat') + '">' + (vals.length > 1 ? (delta > 0 ? '+' : '') + (Math.round(delta * 10) / 10) + ' ' + esc(b.unit) + ' since first test' : vals.length ? 'First test logged' : 'Not tested yet') + '</span></span>' + spark(vals, b.better) + '<span class="bv">' + (vals.length ? last + ' ' + esc(b.unit) : 'Test') + '</span></button>';
    }).join('') + '</div></section>');

    var recent = logs.slice(-5).reverse();
    if (recent.length) out.push('<section class="stack"><h2 class="h-section">Recent sessions</h2><div class="card" style="padding:4px 16px"><div class="list">' + recent.map(function (l) {
      var d = fromIso(l.date);
      return '<div class="item"><span class="grow"><span class="name">' + esc(l.title) + '</span><br><span class="desc">' + DOW[dowOf(d)] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 3) + (l.note ? ' · ' + esc(l.note) : '') + '</span></span><span class="dose">' + l.minutes + ' min · E' + l.effort + ' · J' + l.joints + '</span></div>';
    }).join('') + '</div></div></section>');
    return out.join('');
  }

  /* ---------- sheets ---------- */
  function sheetWrap(title, body, foot) {
    return '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-head"><span class="eyebrow">' + esc(title) + '</span><button class="icon-btn" data-act="close" aria-label="Close">' + ICON.close + '</button></div><div class="sheet-body">' + body + '</div>' + (foot ? '<div class="sheet-foot">' + foot + '</div>' : '') + '</div></div>';

  function resolveSession(key) {
    if (key.indexOf('routine:') === 0) return routineSession(key.slice(8));
    if (key.indexOf('focus:') === 0) { var s = buildSession(key.slice(6), currentWeek(), 0, S.profile); s.key = key; return s; }
    var m = /^w(\d+)d(\d)$/.exec(key);

    return null;
  }

    body += blocksBar(s) + '<div class="legend">' + BLOCKS.map(function (b) { return s.items.some(function (i) { return i.block === b.id; }) ? '<span><i class="b-' + b.id + '" style="background:' + ({ warm: 'var(--ink-3)', activate: 'var(--jade)', main: 'var(--ink)', own: 'var(--brass-fill)', down: 'var(--line)' }[b.id]) + '"></i>' + b.name + '</span>' : ''; }).join('') + '</div>';

    (m.needs.strength || []).forEach(function (n) { needs += '<div class="need"><span class="tag strength">' + esc(FOCUS[n.focus] ? FOCUS[n.focus].short : n.focus) + '</span><p>' + esc(n.note) + '</p></div>'; });

    if (m.before && m.before.length) body += '<div class="stack-s"><div class="eyebrow">Usually comes after</div><div class="chips">' + m.before.map(function (b) { return MOVE[b] ? '<button class="chip" data-act="move" data-id="' + b + '">' + esc(MOVE[b].name) + '</button>' : '<span class="chip">' + esc(b) + '</span>'; }).join('') + '</div></div>';

    var fset = (m.needs.flex || []).concat(m.needs.strength || []).map(function (n) { return n.focus; }).filter(function (f, i, a) { return FOCUS[f] && a.indexOf(f) === i; }).slice(0, 2);

    var b = BENCH[id], series = S.bench[id] || [], body = '';
    body += '<div class="stack-s"><h2 class="h-display" style="font-size:30px">' + esc(b.name) + '</h2><p class="sub">' + esc(b.how) + '</p></div>';

  function sheetSettings() {
    var st = S.settings, body = '';
    body += '<div class="stack-s"><h2 class="h-display" style="font-size:30px">Settings</h2></div>';
    var looks = [['jade', 'Jade', ['#f1ede2', '#20251c', '#47705a', '#b08a3e']], ['bloom', 'Bloom', ['#ebebdf', '#3e4a35', '#6f7f5c', '#c08a7e']], ['chrome', 'Chrome', ['#eceded', '#1b1d20', '#3f6b73', '#b0578a']]];
    body += '<div class="stack-s"><div class="eyebrow">Look</div><div class="swatches">' + looks.map(function (l) { return '<button class="swatch' + ((st.look || 'jade') === l[0] ? ' on' : '') + '" data-act="look" data-look="' + l[0] + '"><span class="dots">' + l[2].map(function (c) { return '<i style="background:' + c + '"></i>'; }).join('') + '</span><span>' + l[1] + '</span></button>'; }).join('') + '</div><p class="note">Three palettes to react to. Light and dark follow your device.</p></div>';

  /* ---------- plan builder (quiz) ---------- */
  function quizStart(seed) {
    var p = S.profile;
    UI.quiz = { step: 0, trains: (p.trains || []).slice(), focus: seed && seed.focus ? seed.focus.slice() : [], style: p.style, level: p.level, classDays: S.sample ? {} : Object.assign({}, p.classDays), perWeek: p.perWeek, minutes: p.minutes, equipment: p.equipment.slice(), from: seed && seed.from,
      have: S.sample ? [] : Object.keys(S.moves).filter(function (k) { return S.moves[k] === 'got'; }) };
    UI.sheet = { type: 'quiz' };
  }
  // The checklist shows the skill groups that match what the user trains.
  function checklist(q) {
    var want = ['flex'];
    if (q.trains.indexOf('lift') >= 0 || q.trains.indexOf('cali') >= 0) want.push('cali');
    if (q.trains.indexOf('dance') >= 0) want.push('dance');
    if (q.trains.indexOf('pole') >= 0) want.push('pole');
    return GROUPS.filter(function (g) { return want.indexOf(g[0]) >= 0; }).map(function (g) {
      return { name: g[1], items: C.moves.filter(function (m) { return (m.group || 'pole') === g[0]; }).sort(function (a, b) { return a.level - b.level; }).slice(0, 6) };
    }).filter(function (g) { return g.items.length; });
  }
  function levelFromHave(have) {
    var n2 = 0, n3 = 0;
    have.forEach(function (id) { var m = MOVE[id]; if (!m) return; if (m.level === 2) n2++; if (m.level === 3) n3++; });
    return n3 >= 2 ? 3 : (n2 >= 1 || n3 >= 1) ? 2 : 1;
  }
  var QSTEPS = 7;
  function sheetQuiz() {
    var q = UI.quiz, body = '', ok = true;
    function head(t, sub) { return '<div class="stack-s"><h2 class="h-display" style="font-size:30px">' + t + '</h2><p class="sub">' + sub + '</p></div>'; }
    body += '<div class="progress-line"><i style="width:' + Math.round(100 * (q.step + 1) / QSTEPS) + '%"></i></div>';
    if (q.step === 0) {
      body += head('What do you train?', 'Everything you already do counts. The plan fits around it.') + '<div class="chips">' + TRAINS.map(function (t) { return '<button class="chip' + (q.trains.indexOf(t[0]) >= 0 ? ' on' : '') + '" data-act="qtrain" data-id="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
    } else if (q.step === 1) {
      ok = q.focus.length > 0;
      body += head('What are you training for?', 'Pick one or two. The plan gets built around the first.' + (q.from ? ' Started from ' + esc(MOVE[q.from].name) + '.' : '')) + '<div class="stack">' + C.focuses.filter(function (f) { return !f.hidden; }).map(function (f) {
        var i = q.focus.indexOf(f.id);
        return '<button class="opt' + (i >= 0 ? ' on' : '') + '" data-act="qfocus" data-id="' + f.id + '"><span class="radio"></span><span class="grow"><span class="ot">' + esc(f.name) + '</span><br><span class="od">' + esc(f.blurb) + '</span></span>' + (i >= 0 ? '<span class="tag plain">' + (i === 0 ? 'First' : 'Second') + '</span>' : pillarTag(f.pillar)) + '</button>';
      }).join('') + '</div>';
    } else if (q.step === 2) {
      body += head('Which sounds like you?', 'This decides whether the plan chases range or builds strength inside the range you have.') + '<div class="stack">' + Object.keys(STYLES).map(function (k) { return '<button class="opt' + (q.style === k ? ' on' : '') + '" data-act="qset" data-k="style" data-v="' + k + '"><span class="radio"></span><span class="grow"><span class="ot">' + STYLES[k].name + '</span><br><span class="od">' + STYLES[k].desc + '</span></span></button>'; }).join('') + '</div>';

    ppause: function () { P.paused = !P.paused; P.last = performance.now(); paintPlayer(false); },
    pnext: function () { P.repElapsed = 0; advance(1); },
    pprev: function () { advance(-1); },
    pfar: function () { S.settings.far = !S.settings.far; save(); renderAll(); },
    pplus: function () { var st = cur(); if (st.type !== 'work' || st.mode === 'reps') return; st.sec += 10; P.remain += 10; P.total += 10; paintClock(); },
    psound: function () { S.settings.sound = !S.settings.sound; save(); renderAll(); },
    pask: function () { P.ask = true; P.paused = true; renderAll(); },
    pkeep: function () { P.ask = false; P.paused = false; P.last = performance.now(); renderAll(); },
    pclose: function () { closePlayer(); },
    pscale: function (d) { var n = document.getElementById('p-note'), keep = n ? n.value : ''; P[d.k] = +d.v; renderAll(); var m = document.getElementById('p-note'); if (m) m.value = keep; },
    psave: function () {
      var note = (document.getElementById('p-note') || {}).value || '', planned = mins(P.session.seconds);
      Object.keys(P.loads).forEach(function (k) { var v = parseFloat(P.loads[k]); if (!isNaN(v)) (S.loads[k] = S.loads[k] || []).push({ date: iso(TODAY), value: v }); });
      S.logs.push({ key: P.key, date: iso(TODAY), title: P.session.title, pillar: P.session.pillar, minutes: P.minutes < planned / 3 ? planned : P.minutes, effort: P.effort || 6, joints: P.joints || 8, note: note.slice(0, 140) });
      save(); closePlayer(); UI.tab = 'today'; renderAll();
    }
  };

  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t || t.disabled) return;
    var fn = ACT[t.getAttribute('data-act')];
    if (fn) fn(t.dataset, e);
  });
  document.addEventListener('input', function (e) { var k = e.target && e.target.getAttribute ? e.target.getAttribute('data-load') : null; if (k && P) P.loads[k] = e.target.value; });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (P && !P.done) return ACT.pask(); if (UI.sheet) ACT.close(); }
    if (P && !P.done && !P.ask) {
      if (e.key === ' ' && !/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)) { e.preventDefault(); ACT.ppause(); }
      if (e.key === 'ArrowRight') ACT.pnext();
      if (e.key === 'ArrowLeft') ACT.pprev();
    }
  });
  document.addEventListener('visibilitychange', function () { if (P && !P.done && document.visibilityState === 'visible') { P.last = performance.now(); lockScreen(); } });

  function routeFromHash() { var h = (location.hash || '').replace('#', ''); if (VIEWS[h]) UI.tab = h; }
  window.addEventListener('hashchange', function () { routeFromHash(); UI.sheet = null; renderAll(); });
  routeFromHash();
  renderAll();
})();

</script>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }</script>
